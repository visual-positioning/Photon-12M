  d_model: 256
  num_heads: 8
  ffn_hidden: 768
  num_layers: 6
  max_length: 32
  num_img_tokens: 4         # Tokens used as keys/values in cross attn
  conditioning_strategy: "cross_attn" # <--- Requires X-Attn layers
  batch_size: 512
  lr: 3.0e-4
  epochs: 10
  weight_decay: 0.01
