# ==============================================================================
# GROUP 1: BASELINE (Reference Point)
# ==============================================================================
- experiment_name: "Exp01_Baseline_L6_D256_P8"
  description: "Standard MobileCap configuration for reference."
  # Paths
  tokenizer_path: "tokenizer/mobilecap_tokenizer.json"
  embeddings_dir: "dataset/MSCOCO2014/embeddings_s1_train_restval"
  karpathy_json_path: "dataset/karapathy_split/dataset_coco.json"
  # Model Hyperparameters
  d_model: 256
  num_heads: 8
  ffn_hidden: 768           # Usually 3x or 4x d_model
  num_layers: 6
  max_length: 32
  num_img_tokens: 8         # Prefix length
  conditioning_strategy: "prefix"
  # Training Hyperparameters
  batch_size: 512
  lr: 3.0e-4
  epochs: 10
  weight_decay: 0.01
  device: "cuda"
  mixed_precision: true     # Standard mixed precision

