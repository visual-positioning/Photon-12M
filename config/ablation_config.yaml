# ==============================================================================
# GROUP 4: CONDITIONING STRATEGY COMPARISON
# Note: Code modifications required to handle 'conditioning_strategy' logic
# ==============================================================================
- experiment_name: "Exp11_Cond_Global_Token"
  tokenizer_path: "tokenizer/mobilecap_tokenizer.json"
  embeddings_dir: "dataset/MSCOCO2014/embeddings_s1_train_restval"
  karpathy_json_path: "dataset/karapathy_split/dataset_coco.json"
  d_model: 256
  num_heads: 8
  ffn_hidden: 768
  num_layers: 6
  max_length: 32
  num_img_tokens: 1         # Usually 1 token for global
  conditioning_strategy: "global_token" # <--- Requires model logic change
  batch_size: 512
  lr: 3.0e-4
  epochs: 10
  weight_decay: 0.01
  device: "cuda"
  mixed_precision: true

- experiment_name: "Exp12_Cond_Mean_Add"
  tokenizer_path: "tokenizer/mobilecap_tokenizer.json"
  embeddings_dir: "dataset/MSCOCO2014/embeddings_s1_train_restval"
  karpathy_json_path: "dataset/karapathy_split/dataset_coco.json"
  d_model: 256
  num_heads: 8
  ffn_hidden: 768
  num_layers: 6
  max_length: 32
  num_img_tokens: 0         # No tokens added to sequence
  conditioning_strategy: "mean_add" # <--- Requires adding emb to every embedding vector
  batch_size: 512
  lr: 3.0e-4
  epochs: 10
  weight_decay: 0.01
  device: "cuda"
  mixed_precision: true

- experiment_name: "Exp13_Cond_Cross_Attn"
  tokenizer_path: "tokenizer/mobilecap_tokenizer.json"
